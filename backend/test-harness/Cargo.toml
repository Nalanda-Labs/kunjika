[package]
name = "kunjika-test-harness"
version = "0.0.1"
edition = "2021"

# ADDITIVE-ONLY test harness. Deliberately a separate crate so
# backend/Cargo.toml and backend/src/* are never touched.
# Build/run: cargo test -p kunjika-test-harness (from backend/test-harness)

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postgres = "0.19"
redis = "0.24"
uuid = { version = "1", features = ["v4"] }
