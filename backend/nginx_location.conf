# use this nginx location config inside server for avoiding CORS
location / {
    proxy_pass http://localhost:5173/;
}
location /api/ {
    proxy_pass http://localhost:8000/api/;
    # The backend rate-limits registrations per client address. Behind this
    # proxy every connection comes from localhost, so pass the real address
    # on; without this header the per-address limit is skipped.
    proxy_set_header X-Real-IP $remote_addr;
}
